<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | Under Caps</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="page-head">
      <div class="breadcrumb"><a href="/">Inicio</a> / <span>Administración</span></div>
      <h1>Panel de administración</h1>
    </div>

    <div class="admin" id="admin-root" hidden>
      <nav class="admin-nav" id="admin-nav">
        <button data-view="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Resumen</button>
        <button data-view="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16a8 8 0 0 1 16 0M4 16h17"/></svg>Productos</button>
        <button data-view="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Pedidos</button>
        <button data-view="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="4"/><path d="M2 21c1-4 4-6 7-6s6 2 7 6M16 4a4 4 0 0 1 0 8M22 21c-.5-2.5-2-4.5-4-5.5"/></svg>Usuarios</button>
        <button data-view="security"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/></svg>Seguridad</button>
        <button id="admin-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Cerrar sesión</button>
      </nav>
      <section id="view"></section>
    </div>
    <div id="admin-denied"></div>
  </main>

  <!-- Modal producto -->
  <div class="modal" id="product-modal">
    <div class="modal-box">
      <h3 id="modal-title">Nuevo producto</h3>
      <form id="product-form">
        <div class="form-msg" id="product-msg"></div>
        <div class="row-2">
          <div class="field"><label>Nombre</label><input class="input" name="name" required></div>
          <div class="field"><label>Categoría</label>
            <select class="input" name="category">
              <option>Baseball</option><option>Dad Hat</option><option>Snapback</option><option>Trucker</option><option>Fitted</option><option>Bucket</option>
            </select>
          </div>
        </div>
        <div class="row-2">
          <div class="field"><label>Precio (COP)</label><input class="input" name="price" type="number" min="0" step="100" required></div>
          <div class="field"><label>Precio anterior (opcional)</label><input class="input" name="comparePrice" type="number" min="0" step="100"></div>
        </div>
        <div class="row-2">
          <div class="field"><label>Inventario</label><input class="input" name="stock" type="number" min="0" required></div>
          <div class="field"><label>Color</label><input class="input" name="color"></div>
        </div>
        <div class="row-2">
          <div class="field"><label>Tallas</label><input class="input" name="sizes" placeholder="Única  ó  S/M, L/XL"></div>
          <div class="field"><label>Etiqueta</label><input class="input" name="badge" placeholder="Nuevo, -20%, ..."></div>
        </div>
        <div class="field"><label>Imagen (ruta o URL)</label><input class="input" name="image" placeholder="/img/products/classic-noir.jpg"><small>Puedes usar una URL https de una imagen.</small></div>
        <div class="field"><label>Descripción</label><textarea class="input" name="description"></textarea></div>
        <div style="display:flex;gap:20px;margin-bottom:20px">
          <label class="check"><input type="checkbox" name="featured"> Destacado</label>
          <label class="check"><input type="checkbox" name="active" checked> Visible en tienda</label>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button type="button" class="btn btn-outline" id="modal-cancel">Cancelar</button>
          <button type="submit" class="btn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
