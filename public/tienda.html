<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda | Under Caps</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="page-head">
      <div class="breadcrumb"><a href="/">Inicio</a> / <span id="crumb">Tienda</span></div>
      <h1 id="title">Todas las gorras</h1>
    </div>

    <div class="shop">
      <aside class="filters">
        <h3>Estilo</h3>
        <ul class="filter-list" id="cat-filters"></ul>
        <h3 class="filter-title">Mostrar</h3>
        <ul class="filter-list" id="extra-filters">
          <li><button data-sale="true">Solo ofertas</button></li>
        </ul>
      </aside>

      <section>
        <div class="toolbar">
          <span class="count" id="count">Cargando…</span>
          <select class="input" id="sort" aria-label="Ordenar">
            <option value="">Destacados</option>
            <option value="populares">Más vendidos</option>
            <option value="nuevos">Más recientes</option>
            <option value="precio-asc">Precio: menor a mayor</option>
            <option value="precio-desc">Precio: mayor a menor</option>
          </select>
        </div>
        <div class="grid" id="products"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/app.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
